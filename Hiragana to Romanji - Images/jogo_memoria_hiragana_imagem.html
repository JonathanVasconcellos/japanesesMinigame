<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória - Hiragana e Imagem</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Japanese&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:;base64,=">
</head>
<body>
  <h1>Jogo da Memória - Hiragana e Imagem</h1>
  <div class="menu">
    <div class="menu-buttons menu-section-spacing">
      <div class="menu-row menu-row-top">
        <button class="start-game-btn" type="button">Iniciar Jogo</button>
        <button id="exitToHomeBtn" type="button">Sair</button>
      </div>
      <div class="menu-row menu-row-bottom">
        <button class="music-toggle-btn" type="button">Pausar Música</button>
      </div>
    </div>
    <div class="menu-section-spacing">
      <label for="pairCount">Número de cartas:</label>
      <select id="pairCount">
        <option value="8">8</option>
        <option value="16">16</option>
        <option value="20">20</option>
        <option value="30">30</option>
      </select>
    </div>
    <div class="alphabet-selector alphabet-selector-wrap">
      <span class="alphabet-title">Alfabeto:</span>
      <label class="alphabet-option">
        <input type="radio" name="alphabet" value="hiragana" checked>
        <span>Hiragana (あ)</span>
      </label>
      <label class="alphabet-option">
        <input type="radio" name="alphabet" value="katakana">
        <span>Katakana (ア)</span>
      </label>
      <label class="alphabet-option">
        <input type="radio" name="alphabet" value="expert">
        <span>Expert (Misturado 🔥)</span>
      </label>
    </div>
    <div class="checkbox-container menu-section-spacing">
      <label><input type="checkbox" class="setCheck" value="Basico" checked> Básico</label>
      <label><input type="checkbox" class="setCheck" value="Intermediario"> Intermediário</label>
      <label><input type="checkbox" class="setCheck" value="Avancado"> Avançado</label>
    </div>
    <div id="errorMessage" class="error" aria-live="polite"></div>
  </div>
  <div class="game-controls">
    <button class="return-menu-btn" type="button">Voltar ao Menu</button>
    <button class="music-toggle-btn" type="button">Pausar Música</button>
  </div>
  <div class="game-container" id="gameContainer">
    <div class="board" id="gameBoard"></div>
    <div class="game-info" id="gameInfo">
      <h3>Informações do Jogo</h3>
      <div class="game-info-row"><p>Modo:</p><span class="info-data" id="modeInfo">Básico</span></div>
      <div class="game-info-row"><p>Tempo:</p><span class="info-data" id="timeElapsed">0 min 0 seg</span></div>
      <div class="game-info-row"><p>Tentativas:</p><span class="info-data" id="attempts">0</span></div>
      <div class="game-info-row"><p>Acertos:</p><span class="info-data" id="matches">0</span></div>
    </div>
  </div>
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal" id="winModal" role="dialog" aria-modal="true" aria-labelledby="winMessage">
    <h2>Parabéns!</h2>
    <p id="winMessage"></p>
    <div id="finalStats"></div>
    <button id="playAgainBtn" type="button">Jogar Novamente</button>
    <button id="menuPrincipalBtn" type="button">Menu Principal</button>
  </div>
  <script src="music-fade.js"></script>
  <script src="script_hiragana_imagem.js"></script>
</body>
</html>
